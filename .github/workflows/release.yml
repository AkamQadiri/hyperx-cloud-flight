name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev

      - name: Build
        run: make

      - name: Package binary
        run: cp bin/cloud_flight cloud_flight-linux-x86_64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cloud_flight-linux-x86_64 --title "$GITHUB_REF_NAME" --generate-notes
